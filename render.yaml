# Render Blueprint — backend Việt An Express (Docker).
# Tạo dịch vụ: Render Dashboard → New → Blueprint → chọn repo này.
# Biến có "sync: false" nhập tay trên Render (không lưu trong repo).
services:
  - type: web
    name: vietan-express-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    # Chỉ deploy sau khi GitHub Actions (CI) chạy đạt.
    autoDeployTrigger: checksPass
    # Chỉ build lại khi backend đổi (sửa frontend không làm deploy lại API).
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Connection string SQL Server (máy chủ phải truy cập được từ Internet, vd Azure SQL).
      - key: ConnectionStrings__Default
        sync: false
      # Khoá ký JWT — Render tự sinh chuỗi ngẫu nhiên 256-bit.
      - key: Jwt__Secret
        generateValue: true
      # Mật khẩu tài khoản admin lần đầu (chỉ dùng khi DB chưa có admin).
      - key: Identity__Seed__AdminPassword
        sync: false
      # Tự áp migration khi khởi động (chỉ tạo schema identity / customers / shipments, không đụng dbo.*).
      - key: Database__MigrateOnStartup
        value: "true"
      # Domain frontend trên Vercel, vd https://viet-an-express.vercel.app (chỉ cần khi gọi API trực tiếp, không qua rewrite).
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Swagger__Enabled
        value: "false"
