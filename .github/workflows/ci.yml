name: CI

# CD không nằm ở đây:
#  - Frontend: Vercel tự build + deploy khi push (thư mục gốc dự án Vercel: web/).
#  - Backend: Render tự deploy từ render.yaml SAU KHI các job dưới đây đạt (autoDeployTrigger: checksPass).

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

# Push mới vào cùng nhánh thì huỷ lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Frontend: kiểm tra kiểu, test, build (web/) ----------
  web:
    name: Web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22          # Vite 8 cần Node ≥ 20.19
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------- Backend: build + toàn bộ test, kể cả test cần SQL Server ----------
  backend:
    name: Backend — build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      # SQL Server tạm cho test tích hợp (test tự tạo DB vietan_tests_xxx rồi xoá).
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Only_Pa55word!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Pa55word!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Mật khẩu chỉ dùng cho SQL Server tạm trong CI (bị huỷ sau job), không phải database thật.
      VIETAN_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Pa55word!;Encrypt=True;TrustServerCertificate=True"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore VietAnExpress.slnx

      - name: Build
        run: dotnet build VietAnExpress.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution VietAnExpress.slnx -c Release --no-build

  # ---------- Backend: image Docker build được và khởi động được (Render dùng đúng Dockerfile này) ----------
  docker:
    name: Backend — Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vietan-api:ci ./backend

      - name: Smoke test — container khởi động và trả /health
        run: |
          docker run -d --name api -p 8080:8080 \
            -e Jwt__Secret=ci-only-secret-0123456789abcdef0123456789 \
            -e Database__RunStartupTasks=false \
            -e ConnectionStrings__Default="Server=127.0.0.1,1;Database=x;User Id=x;Password=x;Connect Timeout=2;TrustServerCertificate=True" \
            vietan-api:ci
          # Không có DB nên /health báo Unhealthy (503) — chỉ kiểm tra ứng dụng đã khởi động và trả lời.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then echo "API trả /health: $code"; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
