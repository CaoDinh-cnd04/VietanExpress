# Cấu hình app Shopify của Việt An — đẩy lên bằng: shopify app deploy (xem web/docs/ECOM_INTEGRATION.md).
# client_id là công khai; client secret KHÔNG để ở đây (chỉ ở backend: Shopify__ClientSecret).


client_id = "6d6bbf47dabe7418f9ad3a8ad7bbccac"
name = "Viet An Express"
application_url = "https://vietan-express.vercel.app/orders"
embedded = true

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = ["https://vietan-express.vercel.app/api/v1/ecom/oauth/shopify/callback"]

[webhooks]
api_version = "2026-10"

  # Đơn mới / đơn sửa → backend đồng bộ nền; gỡ app → kết nối "revoked".
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "orders/create", "orders/updated"]
  uri = "https://vietan-express.vercel.app/api/v1/ecom/webhooks/shopify"

  # 3 webhook compliance (GDPR) bắt buộc với app public — dùng chung 1 URL, backend phân theo X-Shopify-Topic.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://vietan-express.vercel.app/api/v1/ecom/webhooks/shopify"
